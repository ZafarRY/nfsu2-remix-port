name: Buat keystore (sekali saja)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Buat keystore baru
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore nfsu2.jks -alias nfsu2 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=NFSU2 Indonesia, O=Personal, C=ID"
          mkdir out
          base64 -w0 nfsu2.jks > out/KEYSTORE_BASE64.txt
          echo -n "$PASS" > out/KEYSTORE_PASSWORD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-rahasia
          path: out/
          retention-days: 1
