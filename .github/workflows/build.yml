name: Build APK

on:
  workflow_dispatch:
    inputs:
      native_source:
        description: "build = compile .so dari kode (repo harus PRIVAT) | prebuilt = ambil 6 .so dari release"
        type: choice
        options: [build, prebuilt]
        default: build
      data_tag:
        description: "[build] Tag release privat berisi SPEED2.EXE (+ catalog.json bila ada)"
        default: "game-data"
      release_tag:
        description: "[prebuilt] Tag release yang berisi 6 file .so"
        default: "so-zafar"
      version_tag:
        description: "Tag release baru untuk APK (contoh: v1.0.1). Kosongkan = tidak upload ke Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK (bawaan runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # MODE build: lift ulang + compile libnfsu2_android.so (dan 5 .so lain)
      # ------------------------------------------------------------------
      - name: Pastikan repo PRIVAT (exe game tidak boleh di repo publik)
        if: ${{ inputs.native_source == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIV=$(gh repo view "${{ github.repository }}" --json isPrivate -q .isPrivate)
          if [ "$PRIV" != "true" ]; then
            echo "::error::Repo ini publik. Mode build memakai SPEED2.EXE dan menghasilkan kode turunan game; jadikan repo PRIVAT dulu."
            exit 1
          fi

      - name: Pasang alat build
        if: ${{ inputs.native_source == 'build' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools spirv-tools
          python3 -m pip install pefile capstone

      - name: Ambil SPEED2.EXE (dan catalog.json bila ada) dari release privat
        if: ${{ inputs.native_source == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../work
          gh release download "${{ inputs.data_tag }}" --repo "${{ github.repository }}" \
            --pattern 'SPEED2.EXE' --dir ../work
          gh release download "${{ inputs.data_tag }}" --repo "${{ github.repository }}" \
            --pattern 'catalog.json' --dir ../work || true
          ls -l ../work
          echo "SPEED2.EXE: $(stat -c%s ../work/SPEED2.EXE) byte (build terdokumentasi: 4800512)"
          sha256sum ../work/SPEED2.EXE

      - name: pcrecomp + 14 patch
        if: ${{ inputs.native_source == 'build' }}
        run: |
          git clone --depth 1 https://github.com/sp00nznet/pcrecomp ../pcrecomp
          cd ../pcrecomp
          for p in "$GITHUB_WORKSPACE"/patches/pcrecomp/*.patch; do
            echo "apply $p"; git apply "$p"
          done

      - name: DXVK native (disiapkan) + shader
        if: ${{ inputs.native_source == 'build' }}
        run: |
          git clone --branch native-1.9.2b https://github.com/Joshua-Ashton/dxvk-native.git ../reference/dxvk-native
          python3 ports/dxvk_android/prepare.py ../reference/dxvk-native build/dxvk-source
          python3 ports/dxvk_android/shaders.py build/dxvk-source

      - name: libadrenotools (jika belum ada di repo)
        if: ${{ inputs.native_source == 'build' }}
        run: |
          if [ ! -f third_party/libadrenotools/CMakeLists.txt ]; then
            mkdir -p third_party
            git clone --recursive https://github.com/bylaws/libadrenotools third_party/libadrenotools
          fi

      - name: Lift kode game (hooks.txt ikut, termasuk CarSoundTuner)
        if: ${{ inputs.native_source == 'build' }}
        run: |
          python3 scripts/normalize_exe.py ../work/SPEED2.EXE ../work/SPEED2.analysis.exe
          if [ ! -f ../work/catalog.json ]; then
            echo "::warning::catalog.json tidak ada di release; dibuat dari entry point saja (seeds kosong). Hasil bisa kurang lengkap; unggah catalog.json asli bila game crash."
            echo '[]' > ../work/seeds.json
            python3 scripts/run_lift.py catalog ../work/SPEED2.analysis.exe ../work/seeds.json ../work/catalog.json
          fi
          python3 scripts/run_lift.py lift ../work/SPEED2.analysis.exe ../work/catalog.json src/recomp/gen --split 400

      - name: Compile native (CMake + NDK)
        if: ${{ inputs.native_source == 'build' }}
        run: |
          cmake -S android/app/src/main/cpp -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          cmake --build build-android -j"$(nproc)"

      - name: Kumpulkan 6 .so ke jniLibs
        if: ${{ inputs.native_source == 'build' }}
        run: |
          D=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$D"
          for n in nfsu2_android nfsu2_diagnostics main_hook file_redirect_hook gsl_alloc_hook hook_impl; do
            f=$(find build-android -name "lib$n.so" | head -n1)
            [ -n "$f" ] || { echo "::error::lib$n.so tidak ditemukan di hasil build"; exit 1; }
            cp "$f" "$D/"
          done
          ls -l "$D"

      # ------------------------------------------------------------------
      # MODE prebuilt: cara lama (ambil .so dari release)
      # ------------------------------------------------------------------
      - name: Ambil file .so dari release repo ini
        if: ${{ inputs.native_source == 'prebuilt' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" \
            --pattern '*.so' --dir android/app/src/main/jniLibs/arm64-v8a
          rm -f android/app/src/main/jniLibs/arm64-v8a/*Notnolib*
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Cek kecocokan fungsi native (hanya peringatan)
        run: |
          for n in $(grep -hoE 'native +[^ (]+ +[A-Za-z0-9_]+ *\(' $(find android/app/src/main/java -name '*.java') | sed -E 's/ *\($//; s/.* //' | sort -u); do
            grep -qa "_$n" android/app/src/main/jniLibs/arm64-v8a/*.so \
              || echo "::warning::Fungsi native '$n' tidak ada di .so; versi .so mungkin tidak cocok dengan kode Java"
          done

      - name: Siapkan keystore (jika ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nfsu2.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nfsu2.jks" >> "$GITHUB_ENV"
            echo "Memakai keystore sendiri"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi; memakai kunci debug bawaan"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Remix-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK ke Release (hanya jika build berhasil)
        if: ${{ inputs.version_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version_tag }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK" nfsu2-remix.apk
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" nfsu2-remix.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" nfsu2-remix.apk \
              --repo "${{ github.repository }}" \
              --title "NFSU2 Remix $TAG" \
              --notes "CarSoundTuner (scripts/CarSoundData) + perbaikan lain." \
              --target "${{ github.sha }}"
          fi
