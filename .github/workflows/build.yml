name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release di repo ini yang berisi 6 file .so"
        required: true
        default: "so-zafar"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK (bawaan runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ambil file .so dari release repo ini
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" \
            --pattern '*.so' --dir android/app/src/main/jniLibs/arm64-v8a
          rm -f android/app/src/main/jniLibs/arm64-v8a/*Notnolib*
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Cek kecocokan fungsi native (hanya peringatan)
        run: |
          for n in $(grep -hoE 'native +[^ (]+ +[A-Za-z0-9_]+ *\(' $(find android/app/src/main/java -name '*.java') | sed -E 's/ *\($//; s/.* //' | sort -u); do
            grep -qa "_$n" android/app/src/main/jniLibs/arm64-v8a/*.so \
              || echo "::warning::Fungsi native '$n' tidak ada di .so; versi .so mungkin tidak cocok dengan kode Java"
          done

      - name: Siapkan keystore (jika ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nfsu2.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/nfsu2.jks" >> "$GITHUB_ENV"
            echo "Memakai keystore sendiri"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi; memakai kunci debug bawaan"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Remix-apk
          path: android/app/build/outputs/apk/debug/*.apk
