name: Build APK (Java saja, .so dari rilis resmi)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL langsung APK arm64 rilis resmi (sumber file .so)"
        required: true
        default: "https://github.com/codepdbh/nfsu2-recompiled/releases/download/v0.14.9/NFSU2-AndroidEvolved-v0.14.9-arm64.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Ambil file .so dari APK rilis resmi
        run: |
          curl -L --fail -o official.apk "${{ inputs.apk_url }}"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          unzip -j -o official.apk 'lib/arm64-v8a/*.so' -d android/app/src/main/jniLibs/arm64-v8a
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Cek kecocokan fungsi native (hanya peringatan)
        run: |
          for n in $(grep -hoE 'native +[^ (]+ +[A-Za-z0-9_]+ *\(' android/app/src/main/java/com/nfsu2/androidevolved/*.java | sed -E 's/ *\($//; s/.* //' | sort -u); do
            grep -qa "_$n" android/app/src/main/jniLibs/arm64-v8a/*.so \
              || echo "::warning::Fungsi native '$n' tidak ada di .so; versi .so mungkin tidak cocok dengan kode Java"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2-indonesia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
