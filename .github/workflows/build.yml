name: Build APK (Java saja, .so dari release repo ini)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release di repo ini yang berisi 6 file .so"
        required: true
        default: "so-files"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Ambil file .so dari release repo ini
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" \
            --pattern '*.so' --dir android/app/src/main/jniLibs/arm64-v8a
          rm -f android/app/src/main/jniLibs/arm64-v8a/*Notnolib*
          ls -l android/app/src/main/jniLibs/arm64-v8a

      - name: Cek kecocokan fungsi native (hanya peringatan)
        run: |
          for n in $(grep -hoE 'native +[^ (]+ +[A-Za-z0-9_]+ *\(' android/app/src/main/java/com/nfsu2/androidevolved/*.java | sed -E 's/ *\($//; s/.* //' | sort -u); do
            grep -qa "_$n" android/app/src/main/jniLibs/arm64-v8a/*.so \
              || echo "::warning::Fungsi native '$n' tidak ada di .so; versi .so mungkin tidak cocok dengan kode Java"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2-indonesia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
